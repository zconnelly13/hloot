name: test
on: [pull_request, push]
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
    - run: pip install flake8
    - run: make lint

  test:
    runs-on: ubuntu-latest
    env:
      MIDJOURNEY_API_KEY: "<fake-api-key>"
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
    - run: pip install -r requirements.txt
    - run: make test
