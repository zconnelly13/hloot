services:
  web:
    build:
      context: .
      args:
        MIDJOURNEY_API_KEY: ${MIDJOURNEY_API_KEY}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - db:/app/db
    environment:
      - MIDJOURNEY_API_KEY=${MIDJOURNEY_API_KEY}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REDIS_URL=${REDIS_URL}

  celery:
    build:
      context: .
      args:
        MIDJOURNEY_API_KEY: ${MIDJOURNEY_API_KEY}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    command: celery -A hloot worker --loglevel=info
    volumes:
      - staticfiles:/app/staticfiles
      - db:/app/db
    environment:
      - MIDJOURNEY_API_KEY=${MIDJOURNEY_API_KEY}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - web
      - redis

  celery-beat:
    build:
      context: .
      args:
        MIDJOURNEY_API_KEY: ${MIDJOURNEY_API_KEY}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    command: celery -A hloot beat --loglevel=info
    volumes:
      - staticfiles:/app/staticfiles
      - db:/app/db
    environment:
      - MIDJOURNEY_API_KEY=${MIDJOURNEY_API_KEY}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - web
      - redis

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx_prod.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/app/staticfiles
    depends_on:
      - web

volumes:
  staticfiles:
  db:
