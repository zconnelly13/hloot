services:
  web:
    build:
      context: .
      args:
        MIDJOURNEY_API_KEY: ${MIDJOURNEY_API_KEY}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - db:/app/db
    environment:
      - MIDJOURNEY_API_KEY=${MIDJOURNEY_API_KEY}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}

  gameloop:
    build:
      context: .
      args:
        MIDJOURNEY_API_KEY: ${MIDJOURNEY_API_KEY}
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    command: sh -c "python3 manage.py shell < game/game_loop.py"
    volumes:
      - db:/app/db
    environment:
      - MIDJOURNEY_API_KEY=${MIDJOURNEY_API_KEY}
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - PYTHONPATH=/app
    depends_on:
      - web

  frontend:
    build:
      context: frontend
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    command: npm start
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx_dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  staticfiles:
  db:
